<!-- @dsCard group="Prenotazioni" height=320 subtitle="Checklist Da prenotare con stato segnato dall'utente" -->
<div class="is-root" style="padding:24px;max-width:460px">
  <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px"><strong style="font-size:18px">Da prenotare</strong><span class="is-count">3 da prenotare · 1 fatto</span></div>
  <div class="is-booking" data-done="true"><button class="is-check" role="checkbox" aria-checked="true" aria-label="Segna come prenotato: Alloggio a Noto"><span class="is-check__box"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span></button><div><div class="is-booking__name">Alloggio a Noto</div><div class="is-booking__partner">[Partner alloggi]</div></div><span></span></div>
  <div class="is-booking"><button class="is-check" role="checkbox" aria-checked="false" aria-label="Segna come prenotato: Noleggio auto"><span class="is-check__box"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span></button><div><div class="is-booking__name">Noleggio auto</div><div class="is-booking__partner">[Partner noleggio]</div></div><a class="is-btn is-btn--secondary is-btn--sm" href="#">Su [Partner]</a></div>
  <div class="is-booking"><button class="is-check" role="checkbox" aria-checked="false" aria-label="Segna come prenotato: Kayak a Vendicari"><span class="is-check__box"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span></button><div><div class="is-booking__name">Kayak a Vendicari</div><div class="is-booking__partner">[Partner attività]</div></div><a class="is-btn is-btn--secondary is-btn--sm" href="#">Su [Partner]</a></div>
  <div class="is-booking"><button class="is-check" role="checkbox" aria-checked="false" aria-label="Segna come prenotato: Voli"><span class="is-check__box"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span></button><div><div class="is-booking__name">Voli</div><div class="is-booking__partner">[Partner voli]</div></div><a class="is-btn is-btn--secondary is-btn--sm" href="#">Su [Partner]</a></div>
</div>
<script>document.querySelectorAll('.is-check').forEach(function(b){b.addEventListener('click',function(){var on=b.getAttribute('aria-checked')!=='true';b.setAttribute('aria-checked',on?'true':'false');b.closest('.is-booking').setAttribute('data-done',on?'true':'false')})})</script>
