<!-- @dsCard group="Preferenze" height=230 subtitle="Peso di un interesse da 0 a 5" -->
<div class="is-root" style="padding:16px 24px;max-width:520px">
  <div class="is-scale"><span class="is-scale__label">Mare</span><div class="is-scale__pips" role="radiogroup" aria-label="Mare"><button class="is-scale__pip" role="radio" aria-checked="true" aria-label="1"></button><button class="is-scale__pip" role="radio" aria-checked="true" aria-label="2"></button><button class="is-scale__pip" role="radio" aria-checked="true" aria-label="3"></button><button class="is-scale__pip" role="radio" aria-checked="true" aria-label="4"></button><button class="is-scale__pip" role="radio" aria-checked="false" aria-label="5"></button></div></div>
  <div class="is-scale"><span class="is-scale__label">Storia e archeologia</span><div class="is-scale__pips" role="radiogroup" aria-label="Storia"><button class="is-scale__pip" role="radio" aria-checked="true" aria-label="1"></button><button class="is-scale__pip" role="radio" aria-checked="true" aria-label="2"></button><button class="is-scale__pip" role="radio" aria-checked="false" aria-label="3"></button><button class="is-scale__pip" role="radio" aria-checked="false" aria-label="4"></button><button class="is-scale__pip" role="radio" aria-checked="false" aria-label="5"></button></div></div>
  <div class="is-scale"><span class="is-scale__label">Vita notturna</span><div class="is-scale__pips" role="radiogroup" aria-label="Vita notturna"><button class="is-scale__pip" role="radio" aria-checked="false" aria-label="1"></button><button class="is-scale__pip" role="radio" aria-checked="false" aria-label="2"></button><button class="is-scale__pip" role="radio" aria-checked="false" aria-label="3"></button><button class="is-scale__pip" role="radio" aria-checked="false" aria-label="4"></button><button class="is-scale__pip" role="radio" aria-checked="false" aria-label="5"></button></div></div>
</div>
<script>document.querySelectorAll('.is-scale__pips').forEach(function(g){var p=g.querySelectorAll('.is-scale__pip');p.forEach(function(b,i){b.addEventListener('click',function(){p.forEach(function(x,j){x.setAttribute('aria-checked',j<=i?'true':'false')})})})})</script>
