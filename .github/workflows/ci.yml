name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Design system (token generati aggiornati, nessun colore o font scritto a mano in src/)
        run: npm run design:check
      - run: npm run typecheck
      - run: npm test

  database:
    name: Migrazioni, RLS, drift, e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # storage-api serve alle immagini del catalogo (bucket media, route /api/media, e2e).
      # realtime serve al tempo reale dei viaggi di gruppo (broadcast privato, e2e group-realtime).
      - name: Avvia Supabase locale (applica le migrazioni da zero)
        run: npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta

      - name: Test RLS (pgTAP)
        run: npm run db:test

      - name: Controllo drift dello schema
        run: npm run db:drift

      - name: Variabili d'ambiente dallo stack locale
        run: |
          eval "$(npx supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000"
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
            echo "SUPABASE_SECRET_KEY=$SECRET_KEY"
            echo "DATABASE_URL=$DB_URL"
            # Chiave di sola prova per firmare i link verso i partner negli e2e (non è un segreto).
            echo "FLIGHT_LINK_SECRET=ci-only-test-key-not-a-secret"
            # Chatbot negli e2e: modello di prova deterministico (mai su Vercel) e chiave di prova per il
            # rate limit, che per la chat rifiuta senza chiave (fail closed). Non sono segreti.
            echo "CHAT_TEST_MODEL=scripted"
            echo "RATE_LIMIT_SECRET=ci-only-rate-limit-key-not-a-secret"
          } > .env.local
          echo "MAILPIT_URL=$MAILPIT_URL" >> "$GITHUB_ENV"

      - name: Test di integrazione (dbAsUser, RLS via Drizzle)
        run: npm run test:int

      - name: Immagini demo nello storage locale (il seed non carica file)
        run: npm run media:demo

      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Test e2e
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
