name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  database:
    name: Migrazioni, RLS, drift, e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Avvia Supabase locale (applica le migrazioni da zero)
        run: npx supabase start -x studio,storage-api,imgproxy,realtime,edge-runtime,logflare,vector,supavisor,postgres-meta

      - name: Test RLS (pgTAP)
        run: npm run db:test

      - name: Controllo drift dello schema
        run: npm run db:drift

      - name: Variabili d'ambiente dallo stack locale
        run: |
          eval "$(npx supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000"
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
            echo "SUPABASE_SECRET_KEY=$SECRET_KEY"
            echo "DATABASE_URL=$DB_URL"
          } > .env.local
          echo "MAILPIT_URL=$MAILPIT_URL" >> "$GITHUB_ENV"

      - name: Test di integrazione (dbAsUser, RLS via Drizzle)
        run: npm run test:int

      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Test e2e
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
